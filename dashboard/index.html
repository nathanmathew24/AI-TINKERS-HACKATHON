<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expose</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --background: #1c2433;
        --foreground: #e9ebef;
        --card: #2a3040;
        --card-foreground: #e9ebef;
        --border: #3d4354;
        --muted-foreground: #a3acc0;
        --primary: #e05d38;
        --primary-foreground: #ffffff;
        --low: #1c7a4d;
        --medium: #b8720f;
        --high: #d1453d;
        --radius: 0.9rem;
        --font-heading: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
        --font-body: 'Work Sans', ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: var(--background); color: var(--foreground); font-family: var(--font-body); }
      h1, h2, h3 { font-family: var(--font-heading); margin: 0; }
      header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
      h1 { font-size: clamp(26px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; }
      h1 span { color: var(--primary); }
      .connection { color: var(--muted-foreground); font-size: 14px; font-weight: 500; padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; }
      main {
        display: grid;
        grid-template-columns: 1.3fr .9fr;
        grid-template-areas: "risk optouts" "events optouts";
        align-items: start;
        gap: 20px;
      }
      .card-risk { grid-area: risk; }
      .card-optouts { grid-area: optouts; }
      .card-events { grid-area: events; }
      .card {
        background: var(--card);
        color: var(--card-foreground);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: 0 4px 16px -4px rgba(0,0,0,0.35);
      }
      h2 { margin: 0 0 18px; font-size: 20px; font-weight: 700; }
      .url { color: var(--muted-foreground); overflow-wrap: anywhere; font-size: 14px; font-family: ui-monospace, monospace; margin-bottom: 14px; }
      .summary { font-size: 22px; line-height: 1.45; margin: 0 0 18px; font-weight: 500; }
      .badge { display: inline-block; border-radius: 999px; padding: 7px 16px; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; color: #08111a; }
      .low { background: #4ade80; } .medium { background: #fbbf24; } .high { background: #fb7185; }
      ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
      li { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: calc(var(--radius) - 0.35rem); padding: 14px 16px; font-size: 15px; font-weight: 600; }
      li.empty { color: var(--muted-foreground); font-weight: 500; background: none; border-style: dashed; }
      .meta { display: block; color: var(--muted-foreground); font-size: 13px; font-weight: 500; margin-top: 4px; }
      code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
      .error { color: var(--high); }
      @media (max-width: 800px) { body { padding: 16px; } main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header><h1><span>Expose</span></h1><span id="connection" class="connection">Connecting…</span></header>
    <main>
      <div class="card card-risk">
        <h2>What's happening on this page</h2>
        <div id="current-url" class="url">Watching for activity…</div>
        <p id="summary" class="summary">Nothing detected yet.</p><span id="risk" class="badge low">Low risk</span>
      </div>
      <div class="card card-optouts"><h2>What we've asked them to do</h2><ul id="optouts"><li class="empty">Nothing sent yet.</li></ul></div>
      <div class="card card-events"><h2>Who's watching you</h2><ul id="events"><li class="empty">Nothing detected yet.</li></ul></div>
    </main>
    <script>
      const config = window.TRACKER_TRANSPARENCY_CONFIG || {};
      const connection = document.querySelector('#connection');
      const eventsList = document.querySelector('#events');
      const optoutsList = document.querySelector('#optouts');
      const summary = document.querySelector('#summary');
      const risk = document.querySelector('#risk');
      const currentUrl = document.querySelector('#current-url');
      let commitments = new Set();
      let activePageUrl = null;
      let supabaseClient = null;
      const allEvents = [];

      const MAX_VISIBLE_ROWS = 8; // keep the demo tidy - trim oldest as new ones arrive

      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char]);
      const formatDate = (value) => new Date(value).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const clearEmpty = (list) => { if (list.querySelector('.empty')) list.innerHTML = ''; };
      // Live inserts are prepended (newest first), so trim from the end.
      const trimList = (list) => { while (list.children.length > MAX_VISIBLE_ROWS) list.removeChild(list.lastChild); };
      // The initial historical batch is appended oldest-first, so trimming
      // down to the most recent N means removing from the front instead.
      const trimListFromFront = (list) => { while (list.children.length > MAX_VISIBLE_ROWS) list.removeChild(list.firstChild); };

      // Plain-English labels for a non-technical viewer. The raw domain is
      // still shown, small, for anyone who wants to verify it's real.
      const CATEGORY_LABELS = {
        advertising: 'Advertising company',
        analytics: 'Analytics company',
        data_broker: 'Data broker: buys and sells personal data',
      };

      function renderEvent(row, prepend = true) {
        clearEmpty(eventsList); const item = document.createElement('li');
        const label = CATEGORY_LABELS[row.category] || 'Unknown company';
        item.innerHTML = `<strong>${escapeHtml(row.company_name || row.tracker_domain)}</strong><span class="meta">${escapeHtml(label)} · seen at ${formatDate(row.created_at)} · <code>${escapeHtml(row.tracker_domain)}</code></span>`;
        eventsList[prepend ? 'prepend' : 'append'](item);
        if (prepend) trimList(eventsList);
      }
      function renderOptout(row, prepend = true) {
        clearEmpty(optoutsList); const item = document.createElement('li');
        const isCommitted = commitments.has(String(row.company_name).toLowerCase());
        const commitment = isCommitted
          ? "They've publicly promised to respect this"
          : "They haven't promised to listen, so we can't guarantee they will";
        item.innerHTML = `<strong>We told ${escapeHtml(row.company_name)} to stop tracking you</strong><span class="meta">${commitment} · sent at ${formatDate(row.created_at)}</span>`;
        optoutsList[prepend ? 'prepend' : 'append'](item);
        if (prepend) trimList(optoutsList);
      }
      async function updateRisk(pageUrl) {
        const trackers = allEvents.filter(row => row.page_url === pageUrl).map(({ company_name, category }) => ({ company_name, category }));
        currentUrl.textContent = pageUrl; summary.textContent = 'Figuring out how risky this is…';
        const { data, error } = await supabaseClient.functions.invoke('risk-summary', { body: { page_url: pageUrl, trackers } });
        if (error || !data) { summary.textContent = "Couldn't check right now. Try again in a moment."; return; }
        summary.textContent = data.summary; risk.textContent = `${data.risk_level} risk`; risk.className = `badge ${data.risk_level}`;
      }
      function receiveEvent(row) { allEvents.push(row); renderEvent(row); if (row.page_url !== activePageUrl) activePageUrl = row.page_url; if (row.page_url === activePageUrl) updateRisk(activePageUrl); }

      if (!config.supabaseUrl || !config.supabaseAnonKey || config.supabaseUrl.includes('YOUR_')) {
        connection.textContent = 'Add credentials to dashboard/config.js'; connection.classList.add('error');
      } else {
        supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
        fetch('./gpc_commitments.json').then(response => response.json()).then(data => { commitments = new Set(data.committed.map(name => name.toLowerCase())); });
        Promise.all([
          supabaseClient.from('tracker_events').select('*').order('created_at', { ascending: false }).limit(100),
          supabaseClient.from('optout_log').select('*').order('created_at', { ascending: false }).limit(50)
        ]).then(([trackerResult, optoutResult]) => {
          if (trackerResult.error || optoutResult.error) throw trackerResult.error || optoutResult.error;
          trackerResult.data.reverse().forEach(row => { allEvents.push(row); renderEvent(row, false); });
          optoutResult.data.reverse().forEach(row => renderOptout(row, false));
          trimListFromFront(eventsList); trimListFromFront(optoutsList);
          if (allEvents.length) { activePageUrl = allEvents.at(-1).page_url; updateRisk(activePageUrl); }
          connection.textContent = 'Live connection active';
        }).catch(error => { connection.textContent = `Connection error: ${error.message}`; connection.classList.add('error'); });
        supabaseClient.channel('tracker-transparency-live')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'tracker_events' }, payload => receiveEvent(payload.new))
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'optout_log' }, payload => renderOptout(payload.new))
          .subscribe(status => { if (status === 'SUBSCRIBED') connection.textContent = 'Live connection active'; });
      }
    </script>
  </body>
</html>
